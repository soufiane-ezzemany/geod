services:
  backend:
    build: ../backend
    volumes:
      - ../backend:/app
    ports:
      - "5001:5000"
    networks:
      - geod-net

  frontend:
    build: ../frontend
    volumes:
      - ../frontend/src:/app/src
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:5001
    networks:
      - geod-net
    command: npm run dev -- --host 0.0.0.0

  agent-paris:
    build: ../agent
    hostname: agent-paris
    command: python agent.py --backend http://host.docker.internal:5001
    privileged: true
    restart: always
    networks:
      - geod-net

  agent-ny:
    build: ../agent
    hostname: agent-ny
    command: python agent.py --backend http://host.docker.internal:5001
    privileged: true
    restart: always
    networks:
      - geod-net

  agent-tokyo:
    build: ../agent
    hostname: agent-tokyo
    command: python agent.py --backend http://host.docker.internal:5001
    privileged: true
    restart: always
    networks:
      - geod-net

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - geod-net

networks:
  geod-net:
    driver: bridge
