services:
  backend:
    build: ../backend
    volumes:
      - ../backend:/app
    ports:
      - "5001:5000"
    networks:
      - geod-net

  frontend:
    build: ../frontend
    volumes:
      - ../frontend/src:/app/src
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:5001
    networks:
      - geod-net
    command: npm run dev -- --host 0.0.0.0

  paris:
    build: ../agent
    hostname: paris
    command: python agent.py --backend http://host.docker.internal:5001
    privileged: true
    restart: always
    networks:
      - geod-net

  london:
    build: ../agent
    hostname: london
    command: python agent.py --backend http://host.docker.internal:5001
    privileged: true
    restart: always
    networks:
      - geod-net

  new-york:
    build: ../agent
    hostname: new-york
    command: python agent.py --backend http://host.docker.internal:5001
    privileged: true
    restart: always
    networks:
      - geod-net

  tokyo:
    build: ../agent
    hostname: tokyo
    command: python agent.py --backend http://host.docker.internal:5001
    privileged: true
    restart: always
    networks:
      - geod-net

  sydney:
    build: ../agent
    hostname: sydney
    command: python agent.py --backend http://host.docker.internal:5001
    privileged: true
    restart: always
    networks:
      - geod-net

  toronto:
    build: ../agent
    hostname: toronto
    command: python agent.py --backend http://host.docker.internal:5001
    privileged: true
    restart: always
    networks:
      - geod-net

  berlin:
    build: ../agent
    hostname: berlin
    command: python agent.py --backend http://host.docker.internal:5001
    privileged: true
    restart: always
    networks:
      - geod-net

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - geod-net

networks:
  geod-net:
    driver: bridge
